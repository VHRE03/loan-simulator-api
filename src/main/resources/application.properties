spring.application.name=loan-simulator-api

# Perfil activo por defecto (forzamos local para que el dev cree su application-local.properties)
spring.profiles.active=${APP_PROFILE:local}

# Puerto del servicio. Este proyecto es un monolito standalone,
# no hay gateway delante (sin prefijo /loans ni similar).
server.port=${SERVER_PORT:8080}

# Flyway: versiona el esquema y los datos de PostgreSQL.
# Las migraciones viven en src/main/resources/db/migration
# (ver el README.md dentro de esa carpeta).
# Se ejecutan automaticamente al arrancar la aplicacion, en orden y una sola vez.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuracion global de Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
